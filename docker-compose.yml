version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  web:
    build: .
    container_name: dataeng_project
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
    ports:
      - "5001:5000" 
      - "8050:8050"
    volumes:
      - .:/app

volumes:
  mongo_data:
